<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .diagram-container {

    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #e2e8f0;
    padding: 20px;
    width: 100%;
    max-width: 2240px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 26px;
    font-weight: 800;
    fill: #0f2b48;
    text-anchor: middle;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 14px;
    font-weight: 600;
    fill: #475569;
    text-anchor: middle;
  }
  .layer-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-anchor: middle;
  }
  .node-title {
    font-size: 14px;
    font-weight: 700;
    text-anchor: middle;
  }
  .node-desc {
    font-size: 11px;
    font-weight: 500;
    text-anchor: middle;
  }
  .node-desc-sub {
    font-size: 10px;
    font-style: italic;
    text-anchor: middle;
  }
  .badge {

    font-weight: 700;
    fill: #ffffff;
    text-anchor: middle;
    letter-spacing: 0.3px;
  }
  .diamond-text {

    font-weight: 800;
    fill: #78350f;
    text-anchor: middle;
  }
  .edge-label-blue {
    font-size: 11px;
    font-weight: 700;
    fill: #1d4ed8;
    text-anchor: middle;
  }
  .edge-label-green {
    font-size: 11px;
    font-weight: 700;
    fill: #15803d;
    text-anchor: middle;
  }
  .edge-label-red {
    font-size: 11px;
    font-weight: 700;

  .edge-label-purple {

    font-weight: 700;
    fill: #6d28d9;

</head>
